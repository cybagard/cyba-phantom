# CI for cyba-phantom.
#
# Security posture:
#   - one workflow, triggered on push to main and on PRs to main only;
#   - no pull_request_target, no workflow_run, no schedule triggers;
#   - permissions: read-all; no secret is referenced anywhere in this file;
#   - no artifact uploads (write scopes unneeded);
#   - concurrency: one run per ref, superseded runs cancel;
#   - every action is pinned to a full SHA (the tag is a comment);
#   - Go: the runner's toolchain is switched to the exact pinned release
#     via GOTOOLCHAIN (go.mod declares the minimum only — a toolchain line
#     equal to the go line is stripped by go mod tidy), downloaded with
#     Go's checksum verification; no setup-go action, zero dependencies;
#   - one container image: golang:1.27.3 from Docker Hub, pinned by digest
#     (the base image of .devcontainer). The oracle and coldstart jobs use it;
#   - gate checkers (dco, trace, mirror-diff) are built from an explicit
#     checkout of the PR base branch (a ref-less checkout on
#     pull_request would yield the merge ref — the PR's own changes)
#     and run against the PR work tree, so a PR cannot weaken a gate by
#     editing its checker; lint/test/build self-attest and are closed
#     by maintainer-only merge + human review;
#   - exception (bootstrap): when a PR adds a gate checker that the base
#     branch does not have yet, the job falls back to the work tree with
#     a loud warning. This is self-attested; human review and
#     maintainer-only merge close it;
#   - limit: on pull_request, GitHub runs the workflow file from the PR
#     merge ref, so a PR that edits this file runs its edited copy. Human
#     review of every .github/** change is the control for that;
#   - CodeQL workflow scanning is enabled from the repo settings (GitHub
#     App), not from this file — it is the third leg of the gate
#     integrity story for the workflow files themselves.
#
# Jobs:
#   - lint: gofmt, go vet, comment line length and comment sentence length,
#     and go mod tidy;
#   - dco: sign-off and commit identity, on PRs only;
#   - test: go test -race and the coverage gate;
#   - fill: the T-I-16 fill tests on a small tmpfs; a skip fails the job;
#   - oracle: the tar reader oracle, in the pinned golang container;
#   - coldstart: the T-I-03 cold-start test, as root in the same container; a
#     skip fails the job;
#   - trace: the C10 matrix and the sync stamp;
#   - trace-tests: a Go test or a marker for each test ID of the milestone;
#   - mirror-diff: the constitution table;
#   - build: T-P-07, a reproducible, static, sized build under a cgroup budget,
#     and the release build of the two commands.
# The test, fill, oracle, coldstart and build jobs share one checkout step
# through a YAML anchor.
# The dco, trace, trace-tests and mirror-diff jobs share their base-checkout
# and gate-source steps through YAML anchors. The lint job has its own
# checkout.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The gate checkers are built from the PR base branch. Restricting
    # PRs to those targeting main keeps that base on main: a PR
    # targeting any other branch would resolve the base to a branch
    # the author can push (same-repo write access) — running
    # author-controlled checkers. PRs to other branches are
    # maintainer-orchestrated intermediates; the final PR to main
    # re-gates everything from main.
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.3

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The line and sentence checks fail only for text that the PR changed.
    # On pull_request, the checkout has no ref, so it is the PR merge ref.
    # The job builds stelint, gofmt and go vet from that merge ref.
    # The file text that stelint reads comes from HEAD_SHA, the PR head.
    # On push, both SHAs are empty and origin/main is the pushed commit.
    # The range from the merge base to HEAD is then empty.
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout (full history for the base commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gofmt + go vet + comment line and sentence length
        run: make lint BASE="$BASE_SHA" HEAD="$HEAD_SHA"

      - name: go mod tidy
        run: make tidy

  dco:
    # Checker-from-base: every commit in the PR range needs a sign-off
    # (Signed-off-by) and the maintainer identity. A commit with a GPG or
    # SSH signature fails. The header comment of tools/dco/main.go is the
    # only full statement of the rule.
    # PRs only — squash merges drop trailers, so pushed main is never
    # re-checked (the history of main is what was reviewed).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE_FILE: tools/dco/main.go
      GATE_NAME: DCO
    steps:
      - &base-checkout
        name: Base checkout (PR base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
          # Explicit ref is load-bearing: on pull_request, a ref-less
          # checkout yields the merge ref (base + the PR's own changes),
          # which would let a PR ship a weakened checker. On push events
          # the expression is empty, so the event ref (main) is checked
          # out — the single-checkout case.
          ref: ${{ github.event.pull_request.base.ref }}

      - name: PR work tree (full history for the commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: work
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - &gate-source
        # Before this step on purpose: the bootstrap fallback probes for
        # the work tree, so it must already be checked out. Outputs the
        # checker source tree and the tree to check (absolute paths:
        # base/ and work/ are sibling checkouts).
        name: Resolve gate source (base tree; work tree at bootstrap)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tree="$GITHUB_WORKSPACE/work"
          else
            tree="$GITHUB_WORKSPACE/base"
          fi
          if [ -f "$GITHUB_WORKSPACE/base/$GATE_FILE" ]; then
            src="$GITHUB_WORKSPACE/base"
          elif [ -f "$GITHUB_WORKSPACE/work/$GATE_FILE" ]; then
            src="$GITHUB_WORKSPACE/work"
            echo "::warning::bootstrap: $GATE_FILE is not on the PR base — running the $GATE_NAME gate from the PR work tree (self-attested; human review is the control)"
          else
            echo "::error::$GATE_FILE is absent from the base tree and no PR work tree carries it — the $GATE_NAME gate cannot run"
            exit 1
          fi
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: DCO sign-off
        run: |
          (cd "${{ steps.gate.outputs.src }}" && go build -o "$RUNNER_TEMP/dco" ./tools/dco)
          cd "${{ steps.gate.outputs.tree }}"
          "$RUNNER_TEMP/dco" "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-24.04
    # internal/tlog and internal/store take 1.8x longer on some runners
    # (tlog 210 s or 375 s, store 390 s or 575 s on the same code).
    timeout-minutes: 30
    env:
      # The reader oracle needs GNU tar 1.35 and Python 3.13, which the
      # runner image does not have. The oracle job runs it.
      GOFLAGS: -skip=^TestTS19ReaderOracle$
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: go test -race + coverage gate
        run: make coverage

  fill:
    # T-I-16: the fill tests fill a small tmpfs to 92 %. They skip without
    # one, so make fill fails when a named test skips or does not pass. The
    # first step makes a 64 MiB tmpfs for PHANTOM_DISKFULL. It also shrinks
    # /dev/shm, where the decoy test puts its state directory. The runner
    # is a throw-away machine.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PHANTOM_DISKFULL: /mnt/diskfull
    steps:
      - *checkout

      - name: Small tmpfs for the fill tests
        run: |
          sudo mkdir -p "$PHANTOM_DISKFULL"
          sudo mount -t tmpfs -o size=64m,uid=$(id -u),gid=$(id -g),mode=0700 tmpfs "$PHANTOM_DISKFULL"
          sudo mount -o remount,size=64m /dev/shm

      - name: Fill tests (no skip allowed)
        run: make fill

  oracle:
    # The reader oracle of internal/bundle compares Go archive/tar with
    # GNU tar 1.35 and Python 3.13. The job runs in the base image of
    # .devcontainer/Dockerfile, at the same digest (bump both together).
    # With CI=true, a missing tool or another version fails the test.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: golang:1.27.3@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    steps:
      - *checkout

      - name: reader oracle (GNU tar, Python)
        run: go test -race -count=1 -v -run '^TestTS19ReaderOracle$' ./internal/bundle/

  coldstart:
    # T-I-03 (NFR-05): the cold-start test needs root and a free
    # /var/lib/phantom. The runner user is not root, so the test job skips it.
    # The job runs as root in the container of the oracle job, at the same
    # digest. Bump both with .devcontainer. make coldstart fails on a skip.
    # The checkout belongs to the runner user, and the test setup refuses a
    # checkout whose parent directories have another owner. So the job runs
    # the test in a copy that root owns.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: golang:1.27.3@sha256:2920bb124f1a2e12a1d39f0cab756ae0068441ee1da7655dec7f5e374944095b
    steps:
      - *checkout

      - name: Cold-start test (no skip allowed)
        # cp -R, not cp -a, so that root owns the copy. The copy and its
        # parent directory have no group or other write bit. Git also sees a
        # repository of the current user, so go build can stamp version data.
        run: |
          cp -R "$GITHUB_WORKSPACE" /coldstart
          cd /coldstart
          make coldstart

  trace:
    # Checker-from-base: the trace tool is built from the PR base branch
    # and runs against the PR work tree. A PR cannot weaken its own C10
    # gate. At bootstrap (base predates the gate) the tool is built from
    # the work tree — warned, self-attested.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE_FILE: tools/trace/main.go
      GATE_NAME: C10
    steps:
      - *base-checkout
      - &work-checkout
        name: PR work tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: work
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - *gate-source

      - name: C10 matrix + sync stamp
        run: |
          (cd "${{ steps.gate.outputs.src }}" && go build -o "$RUNNER_TEMP/trace" ./tools/trace)
          cd "${{ steps.gate.outputs.tree }}"
          "$RUNNER_TEMP/trace" all spec

  trace-tests:
    # Checker-from-base, as in the trace job. This job has its own
    # GATE_FILE. The base of the PR that adds the tests mode has no
    # tests.go. Thus at bootstrap the job builds from the work tree and
    # gives the warning. The milestone comes from the TRACE_MILESTONE line
    # of the Makefile of the work tree. That line is the one copy of the
    # value.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE_FILE: tools/trace/tests.go
      GATE_NAME: test ID
    steps:
      - *base-checkout
      - *work-checkout
      - *gate-source

      - name: Test IDs of the current milestone
        run: |
          (cd "${{ steps.gate.outputs.src }}" && go build -o "$RUNNER_TEMP/trace" ./tools/trace)
          cd "${{ steps.gate.outputs.tree }}"
          ms=$(sed -n 's/^TRACE_MILESTONE := \(M-[0-9][0-9]*\)$/\1/p' Makefile | tail -n 1)
          if [ -z "$ms" ]; then
            echo "::error::Makefile has no TRACE_MILESTONE := M-n line"
            exit 1
          fi
          "$RUNNER_TEMP/trace" tests spec --milestone "$ms"

  mirror-diff:
    # Checker-from-base: the extraction script comes from the PR base
    # branch; the AGENTS.md table and the golden are the PR's files. At
    # bootstrap (base predates the gate) the script runs from the work
    # tree — warned, self-attested.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GATE_FILE: tools/mirror-diff.sh
      GATE_NAME: C1-C10 mirror
    steps:
      - *base-checkout
      - *work-checkout
      - *gate-source

      - name: C1-C10 table mirror
        run: |
          tree="${{ steps.gate.outputs.tree }}"
          bash "${{ steps.gate.outputs.src }}/tools/mirror-diff.sh" \
            "$tree/AGENTS.md" "$tree/spec/constitution-table.md"

  build:
    # T-P-07: two builds must hash identically; the binary is statically
    # linked and at most 25 MB, built under the 07 section 2 budget
    # (1 vCPU / 512 MB cgroup). PERF_STRICT makes every skipped check a
    # failure: no cgroup, limits not applied, or a missing tool.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PERF_STRICT: "1"
    steps:
      - *checkout

      - name: Reproducible, static, sized build
        run: make perf

      - name: Release build
        run: make build

      - name: Binary facts
        run: |
          file bin/phantom-a || true
          stat -c%s bin/phantom-a | awk '{printf "binary size: %d bytes\n", $1}'
