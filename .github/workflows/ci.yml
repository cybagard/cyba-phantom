# CI for cyba-phantom.
#
# Security posture (mirrors the internal repo's CI spec):
#   - one workflow, triggered on push to main and on PRs to main only;
#   - no pull_request_target, no workflow_run, no schedule triggers;
#   - permissions: read-all; no secret is referenced anywhere in this file;
#   - no artifact uploads (write scopes unneeded);
#   - concurrency: one run per ref, superseded runs cancel;
#   - every action is pinned to a full SHA (the tag is a comment);
#   - Go: the runner's toolchain is switched to the exact pinned release
#     via GOTOOLCHAIN (go.mod declares the minimum only — a toolchain line
#     equal to the go line is stripped by go mod tidy), downloaded with
#     Go's checksum verification; no setup-go action, zero dependencies;
#   - gate checkers (trace, mirror-diff) are built from an explicit
#     checkout of the PR base branch (a ref-less checkout on
#     pull_request would yield the merge ref — the PR's own changes)
#     and run against the PR work tree, so a PR cannot fake its own
#     gates by editing the checkers; lint/test/build self-attest and
#     are closed by maintainer-only merge + human review;
#   - the one exception is a PR that introduces a gate checker while
#     the base branch predates it (bootstrap): the job falls back to
#     the work tree with a loud warning — self-attested, closed by the
#     same human review + maintainer-only merge;
#   - CodeQL workflow scanning is enabled from the repo settings (GitHub
#     App), not from this file — it is the third leg of the gate
#     integrity story for the workflow files themselves.
#
# Jobs: lint (gofmt/vet + DCO on PRs), test (-race + coverage gate),
# trace (C10 matrix + sync stamp), mirror-diff (constitution table),
# build (T-P-07: reproducible, static, sized, cgroup-budgeted).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    # The gate checkers are built from the PR base branch. Restricting
    # PRs to those targeting main keeps that base on main: a PR
    # targeting any other branch would resolve the base to a branch
    # the author can push (same-repo write access) — running
    # author-controlled checkers. PRs to other branches are
    # maintainer-orchestrated intermediates; the final PR to main
    # re-gates everything from main.
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # DCO check needs the full commit range

      - name: gofmt
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "gofmt: files need formatting:"
            echo "$bad"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # DCO: every commit in the PR range must carry a Signed-off-by.
      # PRs only — squash merges drop trailers, so pushed main is never
      # re-checked (the history of main is what was reviewed).
      - name: DCO sign-off (pull requests)
        if: github.event_name == 'pull_request'
        run: go run ./tools/dco "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: go test -race
        run: go test -race ./...

      - name: coverage gate
        run: sh tools/coverage.sh

  trace:
    # Checker-from-base: the trace tool is built from the PR base branch
    # (explicit ref — see below) and runs against the PR work tree. A PR
    # cannot weaken its own C10 gate. At bootstrap (base predates the
    # gate) the tool is built from the work tree — warned, self-attested.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base checkout (PR base branch)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: base
          # Explicit ref is load-bearing: on pull_request, a ref-less
          # checkout yields the merge ref (base + the PR's own changes),
          # which would let a PR ship a weakened checker. On push events
          # the expression is empty, so the event ref (main) is checked
          # out — the single-checkout case.
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Build trace from the base tree (work tree at bootstrap)
        run: |
          if [ -f "$GITHUB_WORKSPACE/base/tools/trace/main.go" ]; then
            src=base
          elif [ -d "$GITHUB_WORKSPACE/work" ]; then
            src=work
            echo "::warning::bootstrap: tools/trace is not on the PR base — building the C10 gate from the PR work tree (self-attested; human review is the control)"
          else
            echo "::error::tools/trace is absent from the base tree and no PR work tree is present — the C10 gate cannot be built"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/bin"
          (cd "$GITHUB_WORKSPACE/$src" && go build -o "$GITHUB_WORKSPACE/bin/trace" ./tools/trace)

      - name: PR work tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: work
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: C10 matrix + sync stamp
        working-directory: ${{ github.event_name == 'pull_request' && 'work' || 'base' }}
        run: ../bin/trace all spec

  mirror-diff:
    # Checker-from-base: the extraction script comes from the PR base
    # branch (explicit ref — see below); the AGENTS.md table and the
    # golden are the PR's files. At bootstrap (base predates the gate)
    # the script runs from the work tree — warned, self-attested.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Base checkout (PR base branch)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: base
          # Same load-bearing ref as the trace job: a ref-less checkout
          # on pull_request yields the merge ref, not the base branch.
          # On push events the expression is empty (event ref = main).
          ref: ${{ github.event.pull_request.base.ref }}

      - name: PR work tree
        if: github.event_name == 'pull_request'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          path: work
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: C1-C10 table mirror
        run: |
          if [ -f "$GITHUB_WORKSPACE/base/tools/mirror-diff.sh" ]; then
            script=base
          elif [ -d "$GITHUB_WORKSPACE/work" ]; then
            script=work
            echo "::warning::bootstrap: tools/mirror-diff.sh is not on the PR base — running the C1-C10 mirror gate from the PR work tree (self-attested; human review is the control)"
          else
            echo "::error::tools/mirror-diff.sh is absent from the base tree and no PR work tree is present — the C1-C10 mirror gate cannot run"
            exit 1
          fi
          # Absolute paths: base/ and work/ are sibling checkouts, so a
          # relative "work/..." resolved from inside base/ would never
          # reach the work tree.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash "$GITHUB_WORKSPACE/$script/tools/mirror-diff.sh" \
              "$GITHUB_WORKSPACE/work/AGENTS.md" \
              "$GITHUB_WORKSPACE/work/spec/constitution-table.md"
          else
            bash "$GITHUB_WORKSPACE/$script/tools/mirror-diff.sh" \
              "$GITHUB_WORKSPACE/base/AGENTS.md" \
              "$GITHUB_WORKSPACE/base/spec/constitution-table.md"
          fi

  build:
    # T-P-07: two builds must hash identically; the binary is statically
    # linked and at most 25 MB, built under the 07 section 2 budget
    # (1 vCPU / 512 MB cgroup).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Reproducible, static, sized build
        run: make perf

      - name: Binary facts
        run: |
          file bin/canary-a || true
          stat -c%s bin/canary-a | awk '{printf "binary size: %d bytes\n", $1}'
